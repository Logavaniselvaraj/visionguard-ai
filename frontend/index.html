<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VisionGuard AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#060a12;--panel:rgba(15,23,41,.62);--panel2:rgba(24,36,62,.72);--line:rgba(130,170,230,.15);--line2:rgba(130,170,230,.30);
--tx:#e7eef9;--mut:#8a9bb6;--dim:#5d6e8a;--cy:#22d3ee;--bl:#4f8cff;--ok:#34d399;--warn:#ffb020;--red:#ff5a4d;
--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--sans:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:14px/1.5 var(--sans);
background-image:radial-gradient(1100px 560px at 85% -10%,rgba(34,211,238,.09),transparent 60%),radial-gradient(900px 520px at -10% 110%,rgba(79,140,255,.09),transparent 60%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(130,170,230,.22);border-radius:8px}
.mono{font-family:var(--mono)}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100dvh;display:flex;flex-direction:column;padding:18px 12px 14px;border-right:1px solid var(--line);background:rgba(6,10,18,.82);backdrop-filter:blur(14px);z-index:40;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cy),var(--bl));color:#031018}
.brand b{font-weight:700;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav button{display:flex;align-items:center;gap:11px;padding:9px 11px;border:1px solid transparent;border-radius:11px;background:none;color:var(--mut);text-align:left;position:relative}
.nav button:hover{background:rgba(130,170,230,.07);color:var(--tx)}
.nav button.on{background:linear-gradient(90deg,rgba(34,211,238,.16),rgba(79,140,255,.05));border-color:var(--line2);color:var(--tx)}
.nav .badge{margin-left:auto}
.sidefoot{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.who{display:flex;gap:10px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#1e3a5f,#0e2038);border:1px solid var(--line2);display:grid;place-items:center;color:var(--cy)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;padding:10px 24px;border-bottom:1px solid var(--line);background:rgba(6,10,18,.78);backdrop-filter:blur(14px);flex-wrap:wrap}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid var(--line);border-radius:99px;background:var(--panel);font-size:12px;color:var(--mut);white-space:nowrap}
.pill b{color:var(--tx);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(52,211,153,.6);flex:none}
.dot.red{background:var(--red)}.dot.warn{background:var(--warn)}.dot.pulse{animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.page{padding:24px;display:flex;flex-direction:column;gap:20px;max-width:1500px;width:100%}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700}h2{font-size:17px}h3{font-size:14.5px}
.sub{color:var(--mut);margin:4px 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.28)}
.card.flat{box-shadow:none;border-radius:14px;background:rgba(10,16,30,.5)}
.card.hot{border-color:rgba(255,90,77,.5);box-shadow:0 0 0 1px rgba(255,90,77,.2),0 10px 40px rgba(255,90,77,.12)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row.sb{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.g6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:11px;border:1px solid var(--line2);background:rgba(130,170,230,.08);font-weight:500;font-size:13px;transition:background .15s,border-color .15s}
.btn:hover{background:rgba(130,170,230,.16)}
.btn.primary{background:linear-gradient(135deg,var(--cy),var(--bl));color:#03111a;border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:rgba(255,90,77,.14);border-color:rgba(255,90,77,.45);color:#ffb3ac}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.icon{padding:7px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:11.5px;border:1px solid var(--line);color:var(--mut);background:rgba(130,170,230,.06)}
.chip.on{border-color:var(--cy);color:var(--cy);background:rgba(34,211,238,.1)}
.chip.red{border-color:rgba(255,90,77,.5);color:#ff9d94;background:rgba(255,90,77,.1)}.chip.warn{border-color:rgba(255,176,32,.5);color:#ffd07a;background:rgba(255,176,32,.1)}.chip.ok{border-color:rgba(52,211,153,.45);color:#7ee8bd;background:rgba(52,211,153,.1)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;display:inline-grid;place-items:center;font-weight:600}
.label{font-size:11.5px;color:var(--dim);letter-spacing:.04em}
input,select,textarea{background:rgba(6,10,18,.7);border:1px solid var(--line2);border-radius:11px;padding:9px 12px;min-width:0}
input::placeholder,textarea::placeholder{color:var(--dim)}
select{appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
select option{background:#0c1424}
.field{display:flex;flex-direction:column;gap:5px;min-width:130px;flex:1}
.stat{padding:16px;display:flex;flex-direction:column;gap:2px}
.stat .n{font-size:28px;font-weight:700;font-family:var(--mono);letter-spacing:-.03em}
.stat .l{color:var(--mut);font-size:12.5px}
.stat.crit .n{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:500;color:var(--dim);text-align:left;font-size:11.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid rgba(130,170,230,.08);vertical-align:middle}
tr.clk:hover td{background:rgba(130,170,230,.05);cursor:pointer}
.scroll-x{overflow-x:auto}
/* camera frames */
.frame{position:relative;aspect-ratio:16/9;background:#05080f;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.frame svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.frame::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
.hud{position:absolute;z-index:2;font-family:var(--mono);font-size:10.5px;text-shadow:0 1px 2px #000;color:#dff}
.hud.tl{left:8px;top:6px}.hud.tr{right:8px;top:6px}.hud.bl{left:8px;bottom:6px}.hud.br{right:8px;bottom:6px}
.live{display:inline-flex;gap:5px;align-items:center;color:#ff7468;font-weight:600}
.live i{width:7px;height:7px;border-radius:50%;background:var(--red);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.cam{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:16px;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:border-color .2s}
.cam:hover{border-color:var(--line2)}
.cam.alerting{border-color:var(--red);box-shadow:0 0 0 1px rgba(255,90,77,.35),0 0 32px rgba(255,90,77,.28);animation:alertGlow 1.3s infinite}
@keyframes alertGlow{50%{box-shadow:0 0 0 1px rgba(255,90,77,.6),0 0 44px rgba(255,90,77,.45)}}
.cam .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.boot{position:absolute;inset:0;z-index:3;display:grid;place-items:center;background:#05080f;color:var(--mut);font-family:var(--mono);font-size:11px;text-align:center}
.spin{width:18px;height:18px;border:2px solid var(--line2);border-top-color:var(--cy);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 8px}
@keyframes spin{to{transform:rotate(360deg)}}
/* chat */
.chat{display:flex;flex-direction:column;gap:14px;min-height:300px}
.bub{max-width:min(760px,100%);padding:11px 14px;border-radius:16px;border:1px solid var(--line)}
.bub.u{align-self:flex-end;background:linear-gradient(135deg,rgba(34,211,238,.2),rgba(79,140,255,.2));border-color:var(--line2)}
.bub.a{align-self:flex-start;background:var(--panel2);width:100%}
.ask{display:flex;gap:8px;align-items:center;padding:8px;border-radius:18px;border:1px solid var(--line2);background:rgba(6,10,18,.8)}
.ask input{flex:1;border:none;background:none;font-size:15px;padding:10px 8px}
.ask:focus-within{border-color:var(--cy);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
.ev{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:14px;padding:12px;border-radius:14px;border:1px solid rgba(34,211,238,.35);background:rgba(34,211,238,.05);margin-top:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}.kv span:nth-child(odd){color:var(--dim)}
.trip{display:flex;gap:8px;flex-wrap:wrap}
.trip>div{flex:1;min-width:120px;border:1px solid rgba(34,211,238,.4);border-radius:12px;padding:8px 10px;background:rgba(34,211,238,.07)}
.trip small{display:block;font-size:10.5px;color:var(--dim);letter-spacing:.04em}
.trip b{font-family:var(--mono);font-size:13px}
.typing span{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:var(--cy);animation:blink 1s infinite}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
/* modal + toasts */
.veil{position:fixed;inset:0;z-index:80;background:rgba(2,5,10,.78);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;overflow:auto}
.modal{width:min(980px,100%);max-height:94vh;overflow:auto;background:#0a1120;border:1px solid var(--line2);border-radius:20px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal.sm{width:min(480px,100%)}
.toasts{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:90;display:flex;flex-direction:column;gap:10px;width:min(380px,calc(100vw - 32px))}
.toast{border-radius:14px;border:1px solid var(--line2);background:#0b1324;padding:12px;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:slideIn .35s ease}
.toast.alert{border-color:var(--red);background:linear-gradient(180deg,rgba(255,90,77,.14),#0b1324 60%)}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}}
.demobar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:85;display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:16px;border:1px solid var(--cy);background:rgba(6,16,28,.94);box-shadow:0 10px 40px rgba(34,211,238,.2);max-width:calc(100vw - 24px)}
.steps{display:flex;gap:4px}.steps i{width:18px;height:4px;border-radius:4px;background:var(--line2)}.steps i.on{background:var(--cy)}
/* misc */
.tog{width:40px;height:22px;border-radius:99px;background:rgba(130,170,230,.2);border:none;position:relative;padding:0;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on{background:var(--cy)}.tog.on::after{transform:translateX(18px)}
.check{display:flex;gap:9px;align-items:center;color:var(--tx);font-size:13px}.check svg{color:var(--ok);flex:none}
.bar{height:6px;border-radius:6px;background:rgba(130,170,230,.15);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--bl))}
.mem{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(10,16,30,.5)}
.arrow{color:var(--cy);font-family:var(--mono)}
.tlwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:rgba(6,10,18,.6)}
.hero{min-height:100vh;display:flex;flex-direction:column}
.hero-in{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:40px;align-items:center;padding:60px 6vw 30px;max-width:1400px;margin:0 auto;width:100%}
.hero h1{font-size:clamp(44px,6vw,84px);line-height:.98;font-weight:800;letter-spacing:-.04em;margin:0 0 18px}
.hero h2{font-size:clamp(20px,2.2vw,28px);font-weight:500;color:var(--cy);margin:0 0 14px;letter-spacing:-.01em}
.feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:0 6vw 60px;max-width:1400px;margin:0 auto;width:100%}
.menu-btn{display:none}
.overlay{display:none}
.flow path.f{stroke-dasharray:6 8;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
@media (max-width:1200px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}
@media (max-width:960px){
.app{grid-template-columns:1fr}
.side{position:fixed;left:0;top:0;bottom:0;height:auto;width:270px;transform:translateX(-102%);transition:transform .25s;padding-top:calc(env(safe-area-inset-top,0px) + 18px)}
.side.open{transform:none}.overlay.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:35}
.menu-btn{display:inline-flex}.hero-in{grid-template-columns:1fr;padding-top:30px}.feat{grid-template-columns:repeat(2,minmax(0,1fr))}
.top{padding:10px 14px}.page{padding:16px 14px}.g3{grid-template-columns:1fr}.ev{grid-template-columns:1fr}}
@media (max-width:640px){.g2,.g4{grid-template-columns:1fr}.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.feat{grid-template-columns:1fr}h1{font-size:22px}.hide-s{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
'use strict';
const {useState,useEffect,useRef,useMemo,useCallback,createContext,useContext}=React;
const h=(t,p,...c)=>{if(p&&p.class!==undefined){p=Object.assign({},p,{className:p.class});delete p.class}return React.createElement(t,p,...c)};
const html=htm.bind(h);

/* =====================================================================
   DATA MODELS (frontend contracts — mirror these in FastAPI/pydantic)
   Camera    {camera_id,name,location,status,fps,last_update}
   Detection {detection_id,camera_id,timestamp,object_type,track_id,bounding_box,confidence,embedding}
   Event     {event_id,camera_id,timestamp,event_type,zone,object_type,confidence,evidence_url}
   Alert     {alert_id,rule,camera_id,timestamp,severity,confidence,status,evidence_url}
   Memory    {memory_id,key,value,camera_id,zone,created_at}
   ===================================================================== */
const CONFIG={USE_MOCK:true,API_BASE:'http://localhost:8000/api',WS_URL:'ws://localhost:8000/ws/alerts'};
/* Backend auto-detection: tries the page origin, then http://localhost:8000. If /api/health answers, mock mode is switched off. */
async function probeBackend(){
  const cands=[...new Set([location.protocol.startsWith('http')?location.origin:null,new URLSearchParams(location.search).get('api'),'http://localhost:8000'].filter(Boolean))];
  for(const o of cands){try{const r=await fetch(o+'/api/health',{signal:AbortSignal.timeout(1500)});if(r.ok){CONFIG.API_BASE=o+'/api';CONFIG.WS_URL=o.replace(/^http/,'ws')+'/ws/alerts';CONFIG.USE_MOCK=false;return true}}catch(e){}}
  return false;
}

/* ---------- utils ---------- */
const pad=n=>String(n).padStart(2,'0');
const sec=s=>{const m=String(s).split(':').map(Number);return m[0]*3600+m[1]*60+(m[2]||0)};
const t12=(s,withSec=true)=>{const H=Math.floor(s/3600),M=Math.floor(s%3600/60),S=Math.floor(s%60);return `${pad(H%12||12)}:${pad(M)}${withSec?':'+pad(S):''} ${H>=12?'PM':'AM'}`};
const hash=str=>{let x=2166136261;for(const c of String(str)){x^=c.charCodeAt(0);x=Math.imul(x,16777619)}return x>>>0};
const rnd=(seed,n)=>hash(seed+'|'+n)/4294967295;
const nowSec=()=>{const d=new Date();return d.getHours()*3600+d.getMinutes()*60+d.getSeconds()};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const store={get(k,d){try{const v=localStorage.getItem('vg_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('vg_'+k,JSON.stringify(v))}catch(e){}}};
const COLORS={red:'#d23b32',blue:'#3b6fc4',black:'#262b34',white:'#dde3ea',grey:'#7b8794'};
const KCOL={person:'#22d3ee',car:'#4f9dff',truck:'#4f9dff',bike:'#4f9dff',bag:'#fbbf24'};
const isVeh=k=>['car','truck','bike','van'].includes(k);

/* ---------- icons ---------- */
const IC={
grid:'M3 3h7v7H3z M14 3h7v7h-7z M14 14h7v7h-7z M3 14h7v7H3z',video:'M1 5h15v14H1z M16 10l7-4v12l-7-4',search:'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z M21 21l-4.3-4.3',
doc:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M9 13h6 M9 17h6',clock:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M12 6v6l4 2',
route:'M6 19a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M18 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M9 16c7 0 2-8 6-8',bell:'M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9 M13.7 21a2 2 0 0 1-3.4 0',
poly:'M12 2l9 7-3.5 12h-11L3 9z',camera:'M23 19V8a2 2 0 0 0-2-2h-3l-2-3H8L6 6H3a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2z M12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',
db:'M12 8c4.4 0 8-1.3 8-3s-3.6-3-8-3-8 1.3-8 3 3.6 3 8 3z M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5 M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3',chart:'M3 3v18h18 M7 15l4-4 3 3 5-6',

function useCount(target,dur=900){
  const [v,setV]=useState(0);const from=useRef(0);
  useEffect(()=>{let raf,t0=performance.now();const f0=from.current;const step=t=>{const p=Math.min(1,(t-t0)/dur);const e=1-Math.pow(1-p,3);const val=f0+(target-f0)*e;setV(val);from.current=val;if(p<1)raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step);return()=>cancelAnimationFrame(raf)},[target]);
  return v;
}

/* ---------- timeline ---------- */
const evIcon=e=>e.event_type==='Restricted Zone Entry'||e.event_type==='Loitering'||e.event_type==='Crowd'?'alert':e.event_type==='Entry'?'arrow':e.event_type==='Exit'?'run':e.event_type==='Object Left'?'bag':e.object_type==='person'?'user':'car';

function Timeline(){
  const A=useApp();const [flt,setFlt]=useState('All');const [zoom,setZoom]=useState(1);const [part,setPart]=useState('morning');
  const types=['All','Person','Vehicle','Alert','Entry','Exit','Object','Suspicious'];
  const inPart=e=>part==='morning'?e.t<12*3600:e.t>=12*3600;
  const list=A.events.filter(inPart).filter(e=>flt==='All'||(flt==='Person'&&e.object_type==='person')||(flt==='Vehicle'&&isVeh(e.object_type))||(flt==='Alert'&&['Restricted Zone Entry','Object Left'].includes(e.event_type))||(flt==='Entry'&&e.event_type.includes('Entry'))||(flt==='Exit'&&e.event_type==='Exit')||(flt==='Object'&&(e.object_type==='bag'||e.event_type==='Object Left'))||(flt==='Suspicious'&&['Loitering','Crowd','Restricted Zone Entry','Object Left'].includes(e.event_type))).sort((a,b)=>a.t-b.t);
  const all=A.events.filter(inPart);const mn=Math.floor(Math.min(...all.map(e=>e.t))/300)*300-300,mx=Math.ceil(Math.max(...all.map(e=>e.t))/300)*300+300;
  const ppm=6*zoom,wid=Math.max(700,(mx-mn)/60*ppm),lane=id=>+id.slice(-1)-1;
  const ticks=[];for(let s=mn;s<=mx;s+=Math.max(300,Math.round(600/zoom/300)*300))ticks.push(s);
  const rowRefs=useRef({});

  return html`<div class="page"><${Head} title="Event timeline" sub="Every indexed event across all cameras. Click any event to open its evidence."><select aria-label="Day part" value=${part} onChange=${e=>setPart(e.target.value)}><option value="morning">Morning (before 12:00)</option><option value="evening">Evening (after 12:00)</option></select><div class="row" style=${{gap:8}}><span class="label">Zoom</span><input type="range" min="0.5" max="4" step="0.5" value=${zoom} onChange=${e=>setZoom(+e.target.value)} aria-label="Timeline zoom"/></div><//>
  <div class="row" style=${{gap:6}}>${types.map(t=>html`<button key=${t} class=${'chip'+(flt===t?' on':'')} onClick=${()=>setFlt(t)}>${t}</button>`)}</div>
  <div class="tlwrap"><div style=${{width:wid+60,position:'relative',height:8*34+44}}>
  ${ticks.map(s=>html`<div key=${s} style=${{position:'absolute',left:30+(s-mn)/60*ppm,top:0,bottom:0,borderLeft:'1px solid rgba(130,170,230,.1)'}}><span class="mono" style=${{position:'absolute',top:4,left:4,fontSize:10,color:'var(--dim)'}}>${hms2(s).slice(0,5)}</span></div>`)}
  ${A.cams.map((c,i)=>html`<div key=${c.camera_id} style=${{position:'absolute',left:0,right:0,top:30+i*34,height:34,borderTop:'1px solid rgba(130,170,230,.08)'}}><span class="mono" style=${{position:'sticky',left:6,fontSize:10,color:'var(--dim)',position:'absolute',top:9,left:6}}>${c.camera_id.slice(-2)}</span></div>`)}
  ${list.map(e=>html`<button key=${e.event_id} title=${`${e.event_type} · ${e.camera_id} · ${t12(e.t)}`} aria-label=${`${e.event_type} ${e.camera_id} ${t12(e.t)}`} onClick=${()=>A.openEv(e)} style=${{position:'absolute',left:30+(e.t-mn)/60*ppm-11,top:30+lane(e.camera_id)*34+5,width:24,height:24,borderRadius:8,border:`1.5px solid ${evCol(e)}`,background:'#0b1324',color:evCol(e),display:'grid',placeItems:'center',padding:0,boxShadow:A.focusEv&&A.focusEv.event_id===e.event_id?'0 0 0 3px rgba(34,211,238,.4)':'none'}}><${Icon} n=${evIcon(e)} s=${13}/></button>`)}</div></div>
  <div class="card col"><h2>${list.length} events</h2>${list.map(e=>html`<div key=${e.event_id} ref=${el=>{rowRefs.current[e.event_id]=el}} class="mem" style=${{cursor:'pointer',borderColor:A.focusEv&&A.focusEv.event_id===e.event_id?'var(--cy)':undefined}} onClick=${()=>A.openEv(e)}><div class="row" style=${{gap:12,flexWrap:'nowrap'}}><span style=${{color:evCol(e)}}><${Icon} n=${evIcon(e)} s=${18}/></span><div><b>${e.event_type==='Person detected'||e.event_type==='Vehicle detected'?e.event_type:`${e.label} · ${e.event_type}`}</b><div class="mono" style=${{fontSize:12,color:'var(--mut)'}}>${t12(e.t)} · ${e.camera_id} ${camName(e.camera_id,A.cams)} · ${e.confidence}%</div></div></div><span class="btn sm">Evidence</span></div>`)}</div></div>`;

  ${edit&&z?z.pts.map((p,i)=>html`<circle key=${i} cx=${p[0]} cy=${p[1]} r="8" fill="#fff" stroke=${ZC[z.type]} strokeWidth="3" style=${{cursor:'grab'}} onPointerDown=${e=>{e.target.setPointerCapture(e.pointerId);drag.current=i}}/>`):null}</svg><//></div>

  <div class="sidefoot"><div class="who"><div class="avatar"><${Icon} n="user" s=${17}/></div><div><b>Security Analyst</b><div class="row" style=${{gap:6,fontSize:12,color:'var(--ok)'}}><i class="dot pulse"></i>AI Engine Online</div></div></div></div></aside>
  <div class="main"><header class="top"><button class="btn icon menu-btn" aria-label="Open menu" onClick=${()=>setNav(true)}><${Icon} n="menu"/></button>

  <div class="sp"></div><span class=${'pill hide-s'}><${Icon} n="shield" s=${13}/>Privacy: <b>${privOn?'ON':'PARTIAL'}</b></span><button class="btn primary sm" onClick=${startDemo} disabled=${!!demo}><${Icon} n="play" s=${13}/>Start demo</button><button class="btn sm" onClick=${()=>setView('landing')}>Home</button></header>
  <main><${P}/></main></div>

  <${Toasts}/>

}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
